# Compila il firmware dell'orologio e lo lascia come file scaricabile.
# Parte SOLO dai push sul ramo main e a mano: nessun innesco da pull request, cosi' nessuno
# dall'esterno puo' far girare codice qui. Il lavoro ha solo permessi di lettura e nessun segreto.
# Tutto a versione fissata per impronta, verificato il 24/11/2026:
#   - immagine ufficiale Espressif espressif/idf:v5.5.5 (17/07/2026), la stessa versione che
#     Waveshare usa per questa scheda;
#   - actions/checkout v7.0.1 (20/07/2026) e actions/upload-artifact v7.0.2 (07/10/2026), di GitHub.
# Risultato: smart-ai-orologio.bin (immagine unica, da scrivere col cavo all'indirizzo 0x0),
# smart-ai-orologio-wifi.bin (il solo programma, per l'aggiornamento via wifi) e le loro sha256.
# Dal giro 3 (25/11/2026) il secondo lavoro, "pubblica", mette i file in una release fw-<commit>:
# da li' l'orologio scarica l'aggiornamento, controllando l'impronta che gli manda il PC. E' l'unico
# lavoro che puo' scrivere nel repository, e non compila niente: prende i file del primo.
name: Firmware orologio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compila:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compila
        shell: bash
        env:
          VERSIONE_FIRMWARE: ${{ github.sha }}
        run: |
          set -euo pipefail
          export VERSIONE_FIRMWARE="${VERSIONE_FIRMWARE:0:7}"
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32s3 build
          idf.py merge-bin -o smart-ai-orologio.bin
          mkdir -p uscita
          cp "$(find build -name smart-ai-orologio.bin -print -quit)" uscita/
          cp build/smart_ai_orologio.bin uscita/smart-ai-orologio-wifi.bin
          cp dependencies.lock uscita/
          cd uscita
          sha256sum smart-ai-orologio.bin | tee smart-ai-orologio.bin.sha256
          sha256sum smart-ai-orologio-wifi.bin | tee smart-ai-orologio-wifi.bin.sha256
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-orologio
          path: uscita/
          if-no-files-found: error
          retention-days: 30

  pubblica:
    needs: compila
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Release fw-<commit> con i file compilati
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n firmware-orologio -D uscita
          ls -l uscita
          gh release create "fw-${GITHUB_SHA:0:7}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Firmware ${GITHUB_SHA:0:7}" --notes "Compilato da $GITHUB_SHA." \
            uscita/smart-ai-orologio.bin uscita/smart-ai-orologio.bin.sha256 \
            uscita/smart-ai-orologio-wifi.bin uscita/smart-ai-orologio-wifi.bin.sha256
